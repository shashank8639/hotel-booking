# =============================================================================
# Production Compose — prod profile, /api/v1, read-only backend rootfs, no public DB
# Usage:
#   cp .env.example .env   # strong DB_PASSWORD + JWT_SECRET
#   docker compose -f docker-compose.prod.yml up --build -d
# TLS: add -f docker-compose.tls.yml (see docs/TLS.md)
# Distroless backend: set DOCKERFILE_BACKEND=Dockerfile.backend.distroless (see docs)
# =============================================================================

name: hotel-booking-prod

services:
  mysql:
    image: mysql:8.0
    container_name: hotel-booking-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-hotel_booking}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/src/main/resources/db/migration/V1__create_tables.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - hotel-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/${DOCKERFILE_BACKEND:-Dockerfile.backend}
    image: hotel-booking-backend:${IMAGE_TAG:-latest}
    container_name: hotel-booking-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-hotel_booking}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SPRING_PROFILES_ACTIVE: prod
      APP_VERSION: ${APP_VERSION:-0.0.1}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0}
      JAVA_OPTS: "-Djava.io.tmpdir=/tmp"
    networks:
      - hotel-net
    # Docker challenge: read-only root filesystem (temp dirs via tmpfs)
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Swagger/OpenAPI disabled in prod — any HTTP response proves Tomcat is up
      test:
        [
          "CMD-SHELL",
          "wget -q -S -O /dev/null http://127.0.0.1:8080/api/v1/auth/login 2>&1 | grep -q 'HTTP/'"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api/v1
    image: hotel-booking-frontend:${IMAGE_TAG:-latest}
    container_name: hotel-booking-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ./docker/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - hotel-net
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,mode=1777
      - /var/run:size=8m,mode=1777
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true

networks:
  hotel-net:
    driver: bridge

volumes:
  mysql-data:
