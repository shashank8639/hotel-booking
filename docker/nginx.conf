# Hotel Booking — Nginx edge (React SPA + API reverse proxy)
# Used by the frontend container. Upstream name "backend" is the Compose service DNS name.
#
# Default profile context-path: /api  (application.yml)
# For SPRING_PROFILES_ACTIVE=prod (/api/v1), use docker/nginx.prod.conf instead.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hide Nginx version from response headers
    server_tokens off;

    # ----- Security headers -----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Enable HSTS only behind real HTTPS termination:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ----- Compression -----
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # ----- Static assets (Vite hashed filenames → long cache) -----
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ----- SPA routing: unknown paths → index.html -----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ----- API reverse proxy → Spring Boot -----
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        # Do not buffer large JSON responses excessively
        proxy_buffering on;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
    }
}
