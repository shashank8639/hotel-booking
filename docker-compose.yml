# =============================================================================
# Development stack — MySQL + Backend + Frontend (Nginx)
# Usage:
#   cp .env.example .env
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Or simply: docker compose up --build  (this file is the base)
# =============================================================================

name: hotel-booking

services:
  mysql:
    image: mysql:8.0
    container_name: hotel-booking-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-hotel_booking}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Optional: auto-apply schema on first boot (idempotent CREATE IF NOT EXISTS)
      - ./backend/src/main/resources/db/migration/V1__create_tables.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/src/main/resources/db/migration/V2__seed_sample_data.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks:
      - hotel-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    image: hotel-booking-backend:local
    container_name: hotel-booking-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-hotel_booking}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-at-least-256-bit-secret-key}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - hotel-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v3/api-docs"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    image: hotel-booking-frontend:local
    container_name: hotel-booking-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - hotel-net

networks:
  hotel-net:
    driver: bridge

volumes:
  mysql-data:
