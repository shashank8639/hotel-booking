# CI — build & test on every push / PR; Docker images tagged with Git SHA
name: CI

on:
  push:
    branches: [main, master, develop, "feature/**"]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write # docker buildx GHA cache

env:
  IMAGE_SHA: ${{ github.sha }}

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests & package
        run: mvn -B verify

      - name: Upload Surefire reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          VITE_API_BASE_URL: /api

  docker:
    name: Docker images (SHA tags)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    outputs:
      image_sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image identity
        id: meta
        run: |
          SHA="${GITHUB_SHA}"
          SHORT="${SHA:0:7}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"
          echo "Backend/Frontend images will be tagged :sha-${SHORT} and :${SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (Git SHA tags)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./docker/Dockerfile.backend
          push: false
          tags: |
            hotel-booking-backend:ci
            hotel-booking-backend:${{ steps.meta.outputs.sha }}
            hotel-booking-backend:sha-${{ steps.meta.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (Git SHA tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.frontend
          push: false
          tags: |
            hotel-booking-frontend:ci
            hotel-booking-frontend:${{ steps.meta.outputs.sha }}
            hotel-booking-frontend:sha-${{ steps.meta.outputs.short }}
          build-args: |
            VITE_API_BASE_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record tags
        run: |
          {
            echo "backend=hotel-booking-backend:${{ steps.meta.outputs.sha }}"
            echo "frontend=hotel-booking-frontend:${{ steps.meta.outputs.sha }}"
            echo "short=sha-${{ steps.meta.outputs.short }}"
          } > image-tags.txt
          cat image-tags.txt

      - name: Upload image tag manifest
        uses: actions/upload-artifact@v4
        with:
          name: image-tags
          path: image-tags.txt
