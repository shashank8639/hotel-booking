# CD — manual publish/deploy template
#
# Does NOT run on push (avoids empty-job failures while secrets are missing).
# Enable publish/deploy after configuring repo secrets:
#   REGISTRY, REGISTRY_USERNAME, REGISTRY_PASSWORD
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
#   SLACK_WEBHOOK_URL (optional)
#
# Usage: Actions → CD → Run workflow
name: CD

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Extra tag (in addition to Git SHA)"
        required: false
        default: "latest"
      enable_publish:
        description: "Set true only after REGISTRY_* secrets exist"
        required: false
        default: "false"
      enable_deploy:
        description: "Set true only after DEPLOY_* secrets exist"
        required: false
        default: "false"

env:
  IMAGE_SHA: ${{ github.sha }}

jobs:
  gate:
    name: CD ready check
    runs-on: ubuntu-latest
    steps:
      - name: Status
        run: |
          echo "publish=${{ inputs.enable_publish }} deploy=${{ inputs.enable_deploy }}"
          echo "Flip inputs to true after secrets are configured."

  publish:
    name: Publish images
    runs-on: ubuntu-latest
    needs: [gate]
    if: ${{ inputs.enable_publish == 'true' }}
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.push.outputs.backend }}
      frontend_image: ${{ steps.push.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Resolve tags
        id: tags
        run: |
          SHORT="${GITHUB_SHA:0:7}"
          EXTRA="${{ inputs.image_tag }}"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"
          echo "extra=${EXTRA}" >> "$GITHUB_OUTPUT"

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./docker/Dockerfile.backend
          push: true
          tags: |
            ${{ secrets.REGISTRY }}/${{ github.repository }}/backend:${{ env.IMAGE_SHA }}
            ${{ secrets.REGISTRY }}/${{ github.repository }}/backend:sha-${{ steps.tags.outputs.short }}
            ${{ secrets.REGISTRY }}/${{ github.repository }}/backend:${{ steps.tags.outputs.extra }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=/api/v1
          tags: |
            ${{ secrets.REGISTRY }}/${{ github.repository }}/frontend:${{ env.IMAGE_SHA }}
            ${{ secrets.REGISTRY }}/${{ github.repository }}/frontend:sha-${{ steps.tags.outputs.short }}
            ${{ secrets.REGISTRY }}/${{ github.repository }}/frontend:${{ steps.tags.outputs.extra }}

      - name: Export image refs
        id: push
        run: |
          echo "backend=${{ secrets.REGISTRY }}/${{ github.repository }}/backend:${{ env.IMAGE_SHA }}" >> "$GITHUB_OUTPUT"
          echo "frontend=${{ secrets.REGISTRY }}/${{ github.repository }}/frontend:${{ env.IMAGE_SHA }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [publish]
    if: ${{ inputs.enable_deploy == 'true' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/hotel-booking
            export IMAGE_TAG="${{ github.sha }}"
            docker compose -f docker-compose.prod.yml pull || true
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

  notify-failure:
    name: Slack notify on failure
    runs-on: ubuntu-latest
    needs: [publish, deploy]
    if: ${{ always() && (needs.publish.result == 'failure' || needs.deploy.result == 'failure') }}
    steps:
      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: ":x: *Hotel Booking CD failed*\nRef: `${{ github.ref }}`\nSHA: `${{ github.sha }}`\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\nActor: ${{ github.actor }}"

      - name: Skip when webhook missing
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: ${{ env.SLACK_WEBHOOK_URL == '' }}
        run: echo "SLACK_WEBHOOK_URL not configured — skipping Slack notify."
