# Optional TLS override — mount host certs and swap Nginx config.
# Usage:
#   mkdir -p certs && cp fullchain.pem privkey.pem certs/
#   docker compose -f docker-compose.prod.yml -f docker-compose.tls.yml up -d
#
# See docs/TLS.md

services:
  frontend:
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${TLS_PORT:-443}:443"
    volumes:
      - ./docker/nginx.tls.conf.example:/etc/nginx/conf.d/default.conf:ro
      - ./certs/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - ./certs/privkey.pem:/etc/nginx/certs/privkey.pem:ro
