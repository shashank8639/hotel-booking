# =============================================================================
# Development overrides — hot local access, verbose ports
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# =============================================================================

services:
  mysql:
    ports:
      - "${DB_PORT:-3306}:3306"

  backend:
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Keep default /api context-path (application.yml)
    ports:
      - "${SERVER_PORT:-8080}:8080"

  frontend:
    build:
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "${FRONTEND_PORT:-8088}:80"
